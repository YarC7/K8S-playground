name: CI/CD Pipeline to K8s HA

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: k8s-playground

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/nestjs-api:latest

    - name: Set up Kubeconfig
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy to Kubernetes Cluster
      run: |
        kubectl apply -f k8s/pgbouncer.yaml --insecure-skip-tls-verify=true
        kubectl apply -f k8s/k8s-deployment.yaml --insecure-skip-tls-verify=true
        kubectl rollout restart deployment/nestjs-api --insecure-skip-tls-verify=true